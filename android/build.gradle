buildscript {
    ext {
        buildToolsVersion = "37.0.0"
        minSdkVersion = 24
        compileSdkVersion = 37
        // Must be 36: this is the targetSdk level where Android enforces the
        // predictive back gesture and stops calling Activity.onBackPressed().
        // The ReactActivity work in ../react-native keys off this too.
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.2.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        // Anything the react-native checkout pins locally.
        mavenLocal()
    }
}

apply plugin: "com.facebook.react.rootproject"
