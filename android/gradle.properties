# Default value: -Xmx512m -XX:MaxMetaspaceSize=256m
# Compiling react-native from source needs more heap than a normal app build.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m
org.gradle.parallel=true
org.gradle.configureondemand=false
android.useAndroidX=true
reactNativeArchitectures=arm64-v8a
newArchEnabled=true
hermesEnabled=true
edgeToEdgeEnabled=true

# Opt out of built-in kotlin and new DSL behavior that ships with AGP 9.
# Starting from AGP 10.x these opt outs will be removed.
android.builtInKotlin=false
android.newDsl=false

# Kotlin's incremental compilation breaks for react-native-screens here, and not in a way that
# fails loudly: the library is reached through node_modules/react-native-screens -> ../../react-native-screens,
# and on an incremental run IC resolves those sources under the canonical path while the previous
# outputs were recorded under the symlinked one. It then treats the module's own classes as an
# external binary dependency, so every `internal` declaration becomes unreadable and compilation
# dies with dozens of "Cannot access ...: it is internal in file" errors in files nobody touched.
# Editing the library requires :react-native-screens:clean in between. Building it from scratch
# costs seconds, so there is nothing to win from IC here.
kotlin.incremental=false

